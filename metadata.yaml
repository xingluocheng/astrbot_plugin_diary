name: astrbot_plugin_diary
display_name: 大肥鱼的日记
short_desc: 记主人的对话，亲密度够的人也记；启动补写，聊天时还会想起来
desc: |-
  给机器人一本日记，全自动，不需要打招呼。

  主要记录**主人**说的话，也记**她自己说过的话**（默认只记私聊，群聊一概不记）。
  这样日记里才有「本鲸当时怎么回的」，不只是别人单方面说了什么。
  如果装了「亲密度」插件，和它聊够天数、关系到「亲密」的人也一并记进来。

  两处触发：**AstrBot 每次启动**后攒够条数就补写一篇；运行中每隔十几到几十小时
  再写一篇。

  日记存在桌面「大肥鱼日记（不要删除）」文件夹，一天一个 markdown，直接打开就能读。
  文件夹被误删也没关系，下次启动自动重建。

  写完之后，最近几篇日记会进入她的上下文，下次聊天她"记得"发生过的事。
help: |-
  【没有指令，全部自动】

  1. 记主人的消息（私聊）、她自己的回复、关系够亲密的人；其他人不进缓冲
  2. AstrBot 启动 15 秒后，攒够「最少消息数」（默认 30 条）就用最近 40 条写一篇
  3. 运行中每 5 分钟检查一次：到间隔时间且攒够 30 条，再写一篇
  4. 写成后存入桌面「大肥鱼日记（不要删除）」，同目录有 index.md 索引
  5. 最近几篇注入系统提示词，聊天时自然想起来

  【和「大肥鱼的亲密度」联动】

  两个插件是上下游关系，装在一起才完整：

  亲密度插件 → 按聊天天数判断谁够亲密 → 写进
  data/plugin_data/astrbot_plugin_intimacy/users.json
                                          ↓
               本插件读这个文件 → 够亲密的人也能进日记

  联动效果：
  · 只装本插件：日记里只有主人
  · 只装亲密度：她说话会分亲疏，但日记里还是只有主人
  · 两个都装：日记里会出现「小晴」这样的亲密朋友，称呼自动区分

  两边门槛要一致——本插件的 intimate_days 要等于亲密度插件的 close_days
  （默认都是 14），否则会出现「这边说亲密、那边说不够」。

  找不到亲密度数据时（没装/被删）不会报错，自动降级成「只记主人」。

  【只记和主人的】
  配置 owner_ids 填主人 QQ 号；private_only 开着就只记私聊。
  留空 owner_ids 时退回 AstrBot 管理员判定。

  【可调项】
  面板 → 插件 → 大肥鱼的日记 → 配置
  启动补写开关与条数、间隔小时数、最少消息数、注入篇数与字数上限、
  是否只记私聊、日记口吻、保留天数。
  【版本历史】
  1.4.4　/好感度 也加入指令过滤，指令和它的回复都不进日记素材
  1.4.2　新增「大肥鱼的 QQ（bot_ids）」配置项：在「收到消息」通道上排除机器人自己。
        她的回复由「发送前拦截」记录，这里只防同一条被记两遍——她说过的话照记，只记一次。
  1.4.3　修复：模型报错（LLM 响应错误 / 402 余额不足）被当成她说过的话记进素材，现在会过滤掉
  1.4.1　修复：重启或热重载后可能把同一批对话再写一遍。
        改为按消息时间戳记账（不再数行号），并加批次指纹去重。
  1.4.0　把她自己的回复也记为素材，日记里能看到她当时是怎么回的
  1.3.2　过滤指令消息（reset / help / 亲密度 / 空间帮助 等），不再拿指令凑字数
  1.3.1　介绍页补「和亲密度插件联动」说明
  1.3.0　读亲密度数据：关系够亲密的人也能进日记，称呼自动区分
  1.2.1　最少消息数从 10 提到 30，更省 token
  1.2.0　新增启动补写；只记主人的私聊
  1.1.0　去掉全部指令改为全自动；日记改存桌面，启动时自动重建文件夹
  1.0.0　首个版本：定时写日记、注入上下文、指令查看
